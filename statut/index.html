<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script defer src="./js/script.js"></script>
    <link rel="stylesheet" href="./css/style.css">
    <title>Tableau de bord serveur</title>
</head>
<body>
<div class="wrapper">
<h1>État du serveur</h1>
<div class="container">
<div class="card">
<h2>Statut</h2>
<p id="api-message">Chargement...</p>
</div>


<div class="card">
<h2>Uptime</h2>
<p id="uptime">Chargement...</p>
</div>


<div class="card">
<h2>Mémoire</h2>
<p id="memory">Chargement...</p>
</div>


<div class="card">
<h2>CPU</h2>
<p id="cpu">Chargement...</p>
</div>


<div class="card">
<h2>Disque</h2>
<p id="disk">Chargement...</p>
</div>


<div class="card">
<h2>Dernière mise à jour</h2>
<p id="timestamp">Chargement...</p>
</div>


<div class="card">
<h2>Ping</h2>
<p id="ping">Chargement...</p>
</div>
</div>
</div>
</body>
</html>
