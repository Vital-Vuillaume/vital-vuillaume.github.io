<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <title>Connexion au panneau</title>
    <link rel="stylesheet" href="../frontend/css/style.css">
    <link rel="stylesheet" href="./connexion.css">
    <script src="../frontend/js/ipOrigins.js" defer></script>
    <script src="../frontend/js/script.js" defer></script>
    <script src="./connexion.js" defer></script>
  </head>
  <body class="login-page">
    <main class="login-card">
      <p class="vl-eyebrow">VitaLoad · administration</p>
      <h1>Connexion</h1>
      <p class="intro">Connectez-vous pour accéder aux outils du projet.</p>
      <form id="login-form">
        <label for="username">Nom d’utilisateur</label>
        <input class="vl-input" id="username" name="username" type="text" autocomplete="username" required maxlength="80">
        <label for="password">Mot de passe</label>
        <input class="vl-input" id="password" name="password" type="password" autocomplete="current-password" required>
        <button class="vl-button" type="submit">Se connecter</button>
        <p id="login-error" class="vl-message" role="alert" aria-live="polite"></p>
      </form>
    </main>
  </body>
</html>
