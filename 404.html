<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <meta name="theme-color" content="#080d19">
    <title>Page introuvable · VitaLoad</title>
    <link rel="stylesheet" href="./404.css">
    <script defer src="./404.js"></script>
  </head>
  <body>
    <main class="not-found">
      <div class="starfield" aria-hidden="true">
        <span class="star star-one"></span>
        <span class="star star-two"></span>
        <span class="star star-three"></span>
        <span class="orbit orbit-one"></span>
        <span class="orbit orbit-two"></span>
        <span class="planet"><span></span></span>
      </div>

      <a class="brand" href="/">VitaLoad<span>.</span></a>
      <section class="not-found-card" aria-labelledby="page-title">
        <p class="eyebrow"><span></span> Signal perdu</p>
        <p class="error-code" aria-hidden="true">404</p>
        <h1 id="page-title">Cette page a pris un autre chemin.</h1>
        <p class="description">Le lien est peut-être ancien, ou l’adresse contient une petite erreur.</p>
        <div class="actions">
          <a class="home-button" href="/">
            <span aria-hidden="true">←</span> Retour à l’accueil
          </a>
          <button id="back-button" class="back-button" type="button">Page précédente</button>
        </div>
        <p id="back-status" class="back-status" role="status" aria-live="polite"></p>
      </section>
      <p class="footer-note">VitaLoad <span>·</span> Espace de travail</p>
    </main>
  </body>
</html>
